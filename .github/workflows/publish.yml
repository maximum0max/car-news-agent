name: Publish car news

# Schedule: every 30 minutes during the Kyiv-time morning (08:00–11:00) and
# evening (18:00–21:00) windows. GitHub Actions cron is in UTC, so during
# EEST (summer, UTC+3) we use 05:00–08:00 UTC and 15:00–18:00 UTC.
# In winter (EET, UTC+2) firings shift +1 hour in local time.
# Manual trigger from the Actions tab is also supported.
on:
  schedule:
    - cron: "0,30 5-8 * * *"     # 08:00, 08:30, ..., 11:00 Kyiv (EEST)
    - cron: "0,30 15-18 * * *"   # 18:00, 18:30, ..., 21:00 Kyiv (EEST)
  workflow_dispatch:

permissions:
  contents: write  # needed to commit the updated processed.json back

concurrency:
  group: publish-car-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update processed articles state"
          # Another commit may have landed on main during the run (a user push,
          # a previous workflow run finishing late). Rebase our state commit
          # on top and retry the push a few times before giving up.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed state update on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; will refetch and retry."
            sleep $((i * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1
